daemon off;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    merge_slashes on;

    log_format custom '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log /dev/stdout custom;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Upgrade only WebSocket requests. Sending "upgrade" on every request can
    # make ordinary JSON/SSE upstream connections behave inconsistently.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    upstream gateway_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    upstream ignis_backend {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    upstream opendots_backend {
        server 127.0.0.1:4310;
        keepalive 32;
    }

    server {
        listen 7860 default_server;
        listen 4096;
        server_name _;

        # Security & Streaming Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Disable buffering for instant SSE streaming (Claude Android & Web)
        proxy_buffering off;
        proxy_cache off;

        # 1. OpenAI & Claude Ingress -> Gateway
        location /v1/ {
            proxy_pass http://gateway_backend/v1/;
        }
        location = /v1 {
            proxy_pass http://gateway_backend/v1;
        }

        # 2. Anthropic & Hermes Ingress -> Gateway
        location /hermes/ {
            proxy_pass http://gateway_backend/hermes/;
        }
        location = /hermes {
            proxy_pass http://gateway_backend/hermes;
        }

        # 3. Dashboards, WebUI & Utilities -> Gateway
        location /dashboard {
            proxy_pass http://gateway_backend;
        }
        location /hermes-webui {
            proxy_pass http://gateway_backend;
        }
        location /logs {
            proxy_pass http://gateway_backend;
        }
        location /health {
            proxy_pass http://gateway_backend;
        }
        location = /hermes-status {
            proxy_pass http://gateway_backend/;
        }

        # Artifacts File Serving -> Gateway
        location /artifacts/ {
            proxy_pass http://gateway_backend/artifacts/;
        }
        location = /artifacts {
            proxy_pass http://gateway_backend/artifacts;
        }

        # 4. Ignis / Obsidian Vault UI and API -> Ignis
        location /vault {
            proxy_pass http://ignis_backend;
        }
        location /vault/ {
            proxy_pass http://ignis_backend/;
        }
        location /obsidian {
            proxy_pass http://ignis_backend;
        }
        location /obsidian/ {
            proxy_pass http://ignis_backend/;
        }

        # 5. OpenDots Core API endpoints -> OpenDots
        location /api/copilotkit {
            proxy_pass http://opendots_backend;
        }
        location /api/workspace {
            proxy_pass http://opendots_backend;
        }
        location /api/spaces {
            proxy_pass http://opendots_backend;
        }
        location /api/dots {
            proxy_pass http://opendots_backend;
        }
        location /api/conversations {
            proxy_pass http://opendots_backend;
        }
        location /api/tasks {
            proxy_pass http://opendots_backend;
        }
        location /api/state {
            proxy_pass http://opendots_backend;
        }
        location /api/memories {
            proxy_pass http://opendots_backend;
        }
        location /api/settings {
            proxy_pass http://opendots_backend;
        }
        location /api/voice {
            proxy_pass http://opendots_backend;
        }
        location /api/setup-telemetry {
            proxy_pass http://opendots_backend;
        }

        # 6. Hermes Gateway API fallback for remaining /api/* (e.g. /api/auth, /api/sessions)
        location /api/ {
            proxy_pass http://gateway_backend;
        }

        # 7. Root and OpenDots Web UI
        location / {
            proxy_pass http://opendots_backend;
        }
    }
}
