name: Decision Engine Tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  decision-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --no-cache-dir httpx fastapi pydantic
      - name: Run decision engine regression tests
        run: python -m unittest discover -s tests -p "test_decision_engine.py" -v
