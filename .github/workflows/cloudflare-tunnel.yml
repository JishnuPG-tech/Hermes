name: OpenCode Serve — Cloudflare Zero Trust Tunnel

# ─────────────────────────────────────────────────────────
#  Starts the full OpenCode-Serve stack on a GitHub Actions
#  7GB RAM runner and exposes it publicly via a Cloudflare
#  Zero Trust Named Tunnel (fixed permanent URL).
#
#  Self-restarts every 5.5 hours before GitHub's 6h limit.
#  Workspace is persisted to HF Dataset between restarts.
#
#  Required GitHub Secrets:
#    CLOUDFLARE_TUNNEL_TOKEN  — from Cloudflare Zero Trust dashboard
#    HF_TOKEN                 — HuggingFace read+write token
#    OPENCODE_SERVER_PASSWORD — password to protect the server
# ─────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # Auto-restart every 6 hours

jobs:
  serve:
    name: OpenCode Serve + Cloudflare Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 330  # 5.5 hours max, then self-restarts

    env:
      HF_TOKEN:                 ${{ secrets.HF_TOKEN }}
      OPENCODE_SERVER_PASSWORD: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
      COPILOT_GITHUB_TOKEN:     ${{ secrets.COPILOT_GITHUB_TOKEN }}
      OPENROUTER_API_KEY:       ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
      XDG_DATA_HOME:            /data/share
      XDG_CONFIG_HOME:          /data/config
      XDG_CACHE_HOME:           /data/cache
      XDG_STATE_HOME:           /data/state

    steps:
      # ── 1. Checkout ─────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. System Setup ──────────────────────────────────
      - name: Create Data Directories
        run: |
          sudo mkdir -p /data/share/opencode /data/config/opencode \
                        /data/cache/opencode /data/state/opencode \
                        /data/logs /projects/default/memory/sessions
          sudo chmod -R 777 /data /projects
          git config --global --add safe.directory '*'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install --quiet "huggingface_hub>=0.23" python-dotenv

      # ── 3. Install OpenCode Binary ───────────────────────
      - name: Install OpenCode Serve
        run: |
          OPENCODE_VERSION="1.18.3"
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin opencode
          sudo chmod +x /usr/local/bin/opencode
          opencode --version

      # ── 4. Install cloudflared ───────────────────────────
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      # ── 5. Restore Workspace from HF Dataset ────────────
      - name: Restore Workspace from HF Dataset
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "[RESTORE] Pulling workspace from Jishnupg/OpenCode-Storage..."
            python3 /home/runner/work/OpenCode-Web/OpenCode-Web/sync_engine.py restore || true
          else
            echo "[RESTORE] HF_TOKEN not set — starting fresh workspace"
          fi

      # ── 6. Configure OpenCode ────────────────────────────
      - name: Configure OpenCode
        run: |
          mkdir -p /data/config/opencode
          cat > /data/config/opencode/opencode.json << 'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "server": {
              "port": 8080,
              "hostname": "127.0.0.1"
            }
          }
          EOF
          echo "[CONFIG] OpenCode config written."

      # ── 7. Bootstrap Memory Templates ───────────────────
      - name: Bootstrap Memory Templates
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path
          MEMORY_DIR = Path("/projects/default/memory")
          SESSIONS_DIR = MEMORY_DIR / "sessions"
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)
          SESSIONS_DIR.mkdir(parents=True, exist_ok=True)
          templates = {
            "GLOBAL.md": "# Global Memory\n\n## User Preferences\n<!-- Add preferences -->\n",
            "PROJECT.md": "# Project Memory\n\n## Overview\n<!-- Describe project -->\n",
            "CONVENTIONS.md": "# Coding Conventions\n\n## Naming\n<!-- Add conventions -->\n",
            "TODO.md": "# Pending Tasks\n\n## High Priority\n<!-- Add tasks -->\n",
          }
          for name, content in templates.items():
            fp = MEMORY_DIR / name
            if not fp.exists():
              fp.write_text(content)
              print(f"[MEMORY] Created: {name}")
          print("[MEMORY] Bootstrap complete")
          PYEOF

      # ── 8. Assemble Memory Context ───────────────────────
      - name: Assemble Memory Context
        run: python3 memory_updater.py once || true

      # ── 9. Start All Background Daemons ─────────────────
      - name: Start Background Daemons
        run: |
          # Sync daemon (workspace persistence)
          nohup python3 sync_engine.py watch > /data/logs/sync.log 2>&1 &
          echo "[SYNC] Started (PID $!)"

          # Memory live-watcher
          nohup python3 memory_updater.py watch > /data/logs/memory.log 2>&1 &
          echo "[MEMORY] Started (PID $!)"

          # Session summariser
          nohup python3 session_watcher.py > /data/logs/sessions.log 2>&1 &
          echo "[SESSION] Started (PID $!)"

          # DB self-healing cleaner
          nohup python3 cleaner.py > /data/logs/cleaner.log 2>&1 &
          echo "[CLEANER] Started (PID $!)"

      # ── 10. Start OpenCode Serve ─────────────────────────
      - name: Start OpenCode Serve
        run: |
          cd /projects/default
          nohup opencode serve --port 8080 --hostname 127.0.0.1 > /data/logs/opencode.log 2>&1 &
          OPENCODE_PID=$!
          echo "OPENCODE_PID=$OPENCODE_PID" >> $GITHUB_ENV
          
          # Wait for opencode to be ready
          echo "[OPENCODE] Waiting for server to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080 > /dev/null 2>&1; then
              echo "[OPENCODE] Server ready after ${i}s"
              break
            fi
            sleep 2
          done

      # ── 11. Start Cloudflare Zero Trust Tunnel ───────────
      - name: Start Cloudflare Zero Trust Tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$TUNNEL_TOKEN" ]; then
            echo "[TUNNEL] ⚠️  CLOUDFLARE_TUNNEL_TOKEN not set!"
            echo "[TUNNEL] Falling back to TryCloudflare (URL changes each run)"
            nohup cloudflared tunnel --url http://localhost:8080 \
              --no-autoupdate > /data/logs/tunnel.log 2>&1 &
          else
            echo "[TUNNEL] Starting Zero Trust Named Tunnel..."
            nohup cloudflared tunnel --no-autoupdate run \
              --token "$TUNNEL_TOKEN" > /data/logs/tunnel.log 2>&1 &
          fi

          # Give tunnel time to connect
          sleep 8

          # Extract and display public URL from logs
          TUNNEL_URL=$(grep -oP 'https://[a-z0-9\-]+\.trycloudflare\.com' /data/logs/tunnel.log 2>/dev/null | head -1 || true)
          if [ -n "$TUNNEL_URL" ]; then
            echo ""
            echo "╔══════════════════════════════════════════════╗"
            echo "║  🌐 OpenCode Serve is PUBLIC at:             ║"
            echo "║  $TUNNEL_URL"
            echo "╚══════════════════════════════════════════════╝"
          else
            echo "[TUNNEL] Named tunnel active — use your configured domain URL"
          fi

      # ── 12. Keep Alive for 5.5 Hours ─────────────────────
      - name: Keep Alive & Monitor
        run: |
          echo "[MONITOR] Server running. Will self-restart in 5.5 hours."
          echo "[MONITOR] Logs at /data/logs/"
          
          END_TIME=$(($(date +%s) + 19800))  # 5.5 hours = 19800 seconds
          
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 60
            
            # Health check opencode
            if ! curl -sf http://127.0.0.1:8080 > /dev/null 2>&1; then
              echo "[MONITOR] ⚠️ OpenCode unresponsive — restarting..."
              cd /projects/default
              nohup opencode serve --port 8080 --hostname 127.0.0.1 >> /data/logs/opencode.log 2>&1 &
            fi
          done
          
          echo "[MONITOR] 5.5 hours reached — shutting down for auto-restart."

      # ── 13. Final Workspace Sync Before Exit ────────────
      - name: Final Workspace Sync
        if: always()
        run: |
          echo "[SYNC] Final sync before restart..."
          python3 sync_engine.py sync || true
          echo "[SYNC] Done."

      # ── 14. Trigger Self-Restart ─────────────────────────
      - name: Trigger Self-Restart
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[RESTART] Triggering next run..."
          gh workflow run cloudflare-tunnel.yml || true
          echo "[RESTART] Next run triggered."
