name: Scheduled Health Check & Workspace Backup

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:

jobs:
  health-check-and-backup:
    name: System Health Check & Sync Backup
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx huggingface_hub

      - name: Verify Live Render & Hugging Face Endpoints
        run: |
          python -c "
          import httpx
          
          endpoints = [
              'https://jishnupg-torproxy.hf.space/health',
              'https://jishnupg-myhermes.hf.space/health',
          ]
          
          for ep in endpoints:
              try:
                  res = httpx.get(ep, timeout=10)
                  print(f'✅ Endpoint {ep} status: {res.status_code}')
              except Exception as e:
                  print(f'⚠️ Endpoint {ep} reachability warning: {e}')
          "

      - name: Trigger Workspace Sync Backup
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from sync_engine import SyncEngine
          engine = SyncEngine()
          print('✅ Sync engine initialization verified')
          " || true
