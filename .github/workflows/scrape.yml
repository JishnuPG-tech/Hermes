name: Deep Web Scraping & Research Agent

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scrape'
        required: true
        default: 'https://news.ycombinator.com'
      search_query:
        description: 'Research topic or query'
        required: false
        default: 'AI agent architecture'

jobs:
  scrape-and-research:
    name: Scrape & Synthesize Content (7GB RAM Runner)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Scraping Tools
        run: |
          python -m pip install --upgrade pip
          pip install httpx selectolax playwright beautifulsoup4 huggingface_hub
          python -m playwright install --with-deps chromium

      - name: Execute Scraping Script
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          SEARCH_QUERY: ${{ github.event.inputs.search_query }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os, asyncio, httpx
          from selectolax.parser import HTMLParser
          
          url = os.environ.get('TARGET_URL', 'https://news.ycombinator.com')
          print(f'🌐 Scraping target URL: {url}')
          
          try:
              resp = httpx.get(url, timeout=15, follow_redirects=True)
              html = HTMLParser(resp.text)
              title = html.css_first('title').text() if html.css_first('title') else 'No title'
              print(f'✅ Page Title: {title}')
              
              # Extract clean text chunks
              body_text = ' '.join([node.text(strip=True) for node in html.css('p, h1, h2, h3, li') if node.text(strip=True)])
              summary_md = f'# Research Summary\n\n**URL**: {url}\n**Title**: {title}\n\n## Content Excerpt\n{body_text[:3000]}\n'
              
              with open('research_summary.md', 'w', encoding='utf-8') as f:
                  f.write(summary_md)
              print('✅ Saved research_summary.md')
          except Exception as e:
              print(f'❌ Scraping failed: {e}')
          "

      - name: Upload Research Result Artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-summary-result
          path: research_summary.md
