name: E2E Integration & API Testing

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    name: Run Integration & API Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Test Runner
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic python-dotenv httpx pytest

      - name: Run API Server Integration Tests
        run: |
          python -c "
          import opencode_serve_lite
          from fastapi.testclient import TestClient
          client = TestClient(opencode_serve_lite.app)
          
          # Test Health Endpoint
          res_health = client.get('/health')
          assert res_health.status_code == 200, f'Health status failed: {res_health.status_code}'
          print('✅ Health Check Test Passed')
          
          # Test Root Endpoint
          res_root = client.get('/')
          assert res_root.status_code == 200, f'Root endpoint failed: {res_root.status_code}'
          print('✅ Root Endpoint Test Passed')
          
          # Test Models Endpoint
          res_models = client.get('/v1/models')
          assert res_models.status_code == 200, f'Models endpoint failed: {res_models.status_code}'
          print('✅ Models Endpoint Test Passed')
          "

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Mobile Test Suite
        run: |
          if [ -d "mobile" ]; then
            cd mobile
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
            npm test || true
          fi
